pipeline:
  name: data-ci
  identifier: data_ci
  projectIdentifier: Project_Shifu
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: githubconnector
        repoName: <+input>
        build: <+input>
  variables:
    - name: HF_TOKEN
      type: String
      description: HuggingFace Write Token to push data to HuggingFace
      value: <+secrets.getValue("HUGGINGFACE_WRITE_TOKEN")>
    - name: GITHUB_CLIENT_ID
      type: String
      description: Github App Token
      value: <+secrets.getValue("GITHUB_APP_CLIENT_ID")>
    - name: GITHUB_INSTALLATION_ID
      type: String
      description: Github App Token
      value: <+secrets.getValue("GITHUB_APP_INSTALLATION_ID")>
    - name: GITHUB_PRIVATE_KEY
      type: String
      description: Github App Token
      value: <+secrets.getValue("GITHUB_APP_PRIVATE_KEY")>
  stages:
    - stage:
        name: Compile
        identifier: compile
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Docker
            spec: {}
          execution:
            steps:
              - step:
                  type: GitClone
                  name: Clone pipeline scripts
                  identifier: clone_pipeline_scripts
                  spec:
                    connectorRef: githubconnector
                    repoName: pipelines
                    cloneDirectory: ./pipeline-scripts
                    build:
                      type: branch
                      spec:
                        branch: main
                    depth: 1
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Retry
                          spec:
                            retryCount: 2
                            retryIntervals:
                              - 30s
                            onRetryFailure:
                              action:
                                type: Abort
              - step:
                  type: Run
                  name: Setup Python environment
                  identifier: setup_env
                  spec:
                    shell: Bash
                    command: bash $PWD/pipeline-scripts/shifu/data-ci/scripts/setup_env.sh
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Retry
                          spec:
                            retryCount: 2
                            retryIntervals:
                              - 30s
                            onRetryFailure:
                              action:
                                type: Abort
              - step:
                  type: Run
                  name: Prepare dataset workspace
                  identifier: acquire_dataset
                  spec:
                    shell: Bash
                    command: bash $PWD/pipeline-scripts/shifu/data-ci/scripts/acquire_dataset.sh
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Retry
                          spec:
                            retryCount: 2
                            retryIntervals:
                              - 30s
                            onRetryFailure:
                              action:
                                type: Abort
              - step:
                  type: Run
                  name: Pre-validate
                  identifier: pre_validate
                  spec:
                    shell: Bash
                    command: bash $PWD/pipeline-scripts/shifu/data-ci/scripts/pre_validate.sh
              - step:
                  type: Run
                  name: Compile
                  identifier: compile
                  spec:
                    shell: Bash
                    command: bash $PWD/pipeline-scripts/shifu/data-ci/scripts/compile_dataset.sh
              - step:
                  type: Run
                  name: Post-validate
                  identifier: post_validate
                  spec:
                    shell: Bash
                    command: bash $PWD/pipeline-scripts/shifu/data-ci/scripts/post_validate.sh
              - step:
                  type: Run
                  name: Publish
                  identifier: publish
                  spec:
                    shell: Bash
                    envVariables:
                      GITHUB_APP_CLIENT_ID: <+pipeline.variables.GITHUB_CLIENT_ID>
                      GITHUB_APP_INSTALLATION_ID: <+pipeline.variables.GITHUB_INSTALLATION_ID>
                      GITHUB_APP_PRIVATE_KEY: <+pipeline.variables.GITHUB_PRIVATE_KEY>
                      HF_TOKEN: <+pipeline.variables.HF_TOKEN>
                    command: bash $PWD/pipeline-scripts/shifu/data-ci/scripts/publish.sh
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Retry
                          spec:
                            retryCount: 3
                            retryIntervals:
                              - 60s
                            onRetryFailure:
                              action:
                                type: ManualIntervention
                                spec:
                                  timeout: 2h
                                  onTimeout:
                                    action:
                                      type: Abort
              - parallel:
                  - step:
                      type: Run
                      name: Register to Deputy
                      identifier: register_deputy
                      spec:
                        shell: Bash
                        command: bash $PWD/pipeline-scripts/shifu/data-ci/scripts/register_deputy.sh
                  - step:
                      type: Run
                      name: Notify
                      identifier: notify
                      spec:
                        shell: Bash
                        command: bash $PWD/pipeline-scripts/shifu/data-ci/scripts/notify.sh
                      failureStrategies:
                        - onFailure:
                            errors:
                              - AllErrors
                            action:
                              type: Ignore
                  - step:
                      type: Run
                      name: Trigger training
                      identifier: trigger_training
                      spec:
                        shell: Bash
                        command: bash $PWD/pipeline-scripts/shifu/data-ci/scripts/trigger_training.sh
                      failureStrategies:
                        - onFailure:
                            errors:
                              - AllErrors
                            action:
                              type: Retry
                              spec:
                                retryCount: 2
                                retryIntervals:
                                  - 30s
                                onRetryFailure:
                                  action:
                                    type: ManualIntervention
                                    spec:
                                      timeout: 2h
                                      onTimeout:
                                        action:
                                          type: Abort
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: MarkAsFailure
        delegateSelectors:
          - linux-amd64
